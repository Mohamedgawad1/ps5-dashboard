plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snakegame.app'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId "com.snakegame.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ksFile = rootProject.file("keystore/snake-release.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "SNAKE2026STORE"
                keyAlias "snake"
                keyPassword "SNAKE2026KEY"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file("keystore/snake-release.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
