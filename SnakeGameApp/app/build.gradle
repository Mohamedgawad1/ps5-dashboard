plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snakegame.app'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId "com.snakegame.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ks = new File(rootProject.file("keystore/snake-release.jks"))
            if (ks.exists()) {
                storeFile ks
                storePassword "SNAKE2026STORE"
                keyAlias "snake"
                keyPassword "SNAKE2026KEY"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file("keystore/snake-release.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
